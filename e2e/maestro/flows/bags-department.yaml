# Maestro flow: Bags department (Web)
# Original: 4 crossbody bags on wall hooks + 3x2 oak cubby unit with 6 standing bags
appId: com.showstudio.web
url: http://show-studio-seven.vercel.app
viewport:
  width: 390
  height: 844
tags: [bags, department]
---

- launchApp:
    url: http://show-studio-seven.vercel.app

- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

# Wait for nav pills to be rendered via JS
- assertTrue:
    condition: "document.querySelectorAll('nav button').length >= 5"
    timeout: 30000

# Navigate to Bags department
- tapOn:
    text: "Bags"

# Verify section changed - Bags button should be active (bg-white)
- assertTrue:
    condition: "Array.from(document.querySelectorAll('nav button')).some(b => b.textContent.trim() === 'Bags' && b.classList.contains('bg-white'))"

# Verify 3D canvas is present
- assertTrue:
    condition: "document.querySelector('canvas') !== null"