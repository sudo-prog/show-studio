# Maestro flow: Caps department (Web)
# Original: 2x4 birch pegboard with 8 caps on pegs
appId: com.showstudio.web
url: http://show-studio-seven.vercel.app
viewport:
  width: 390
  height: 844
tags: [caps, department]
---

- launchApp:
    url: http://show-studio-seven.vercel.app

- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

# Dismiss splash
- tapOn:
    point: 50%, 90%

# Navigate to Caps department
- tapOn:
    text: "Caps"

# Verify we're in caps section with canvas present
- assertTrue:
    condition: "document.querySelector('canvas') !== null"

# Verify return to overview
- tapOn:
    text: "Store"
- assertVisible: "Store"