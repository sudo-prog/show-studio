# Maestro flow: Caps department (Web)
# Original: 2x4 birch pegboard with 8 caps on pegs
appId: com.showstudio.web
url: http://show-studio-seven.vercel.app
viewport:
  width: 390
  height: 844
tags: [caps, department]
---

- launchApp:
    url: http://show-studio-seven.vercel.app

- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

# Wait for nav pills to be rendered via JS
- assertTrue:
    condition: "document.querySelectorAll('nav button').length >= 5"
    timeout: 30000

# Navigate to Caps department
- tapOn:
    text: "Caps"

# Verify section changed - Caps button should be active (bg-stone-900 = dark on light nav)
- assertTrue:
    condition: "Array.from(document.querySelectorAll('nav button')).some(b => b.textContent.trim() === 'Caps' && b.classList.contains('bg-stone-900'))"

# Verify 3D canvas is present
- assertTrue:
    condition: "document.querySelector('canvas') !== null"