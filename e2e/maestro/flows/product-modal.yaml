# Maestro flow: Product Modal Interaction (Web)
# Tests opening a product, 360° turn stage, size selector, add to cart
appId: com.showstudio.web
url: http://show-studio-seven.vercel.app
viewport:
  width: 390
  height: 844
tags: [product, modal]
---

- launchApp:
    url: http://show-studio-seven.vercel.app

- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

# Wait for nav pills and bring into view
- scrollUntilVisible:
    element:
      text: "Store"
    direction: DOWN
    timeout: 30000

# Go to Clothing section where garments are
- tapOn:
    text: "Clothing"

# Wait for section to load - verify active navigation (bg-stone-900 = dark on light nav)
- assertTrue:
    condition: "Array.from(document.querySelectorAll('nav button')).some(b => b.textContent.trim() === 'Clothing' && b.classList.contains('bg-stone-900'))"

# Tap on center of canvas to reveal product (first tap = hover/reveal)
- tapOn:
    point: 50%, 45%

# Wait for reveal
- sleep:
    seconds: 1

# Second tap on same product opens modal (two-tap interaction matches reference)
- tapOn:
    point: 50%, 45%

# Verify modal opened with Add to Cart button
- extendedWaitUntil:
    visible: "Add to Cart"
    timeout: 15000

# Verify "Select Size" is present
- assertVisible: "Select Size"

# Verify "In Stock" indicator
- assertVisible: "In Stock"

# Verify close button (X) exists
- assertTrue:
    condition: "document.querySelector('button[aria-label=\"Close product view\"]') !== null"

# Close product modal by tapping top-right area
- tapOn:
    point: 90%, 10%