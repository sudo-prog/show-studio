# Maestro flow: Touch momentum and snap-back (Web)
# Verifies that product 360° drag has momentum after release
# and spring snaps back to nearest quadrant
appId: com.showstudio.web
url: http://show-studio-seven.vercel.app
viewport:
  width: 390
  height: 844
tags: [touch, momentum, snap]
---

- launchApp:
    url: http://show-studio-seven.vercel.app

- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

# Wait for nav pills to be rendered via JS
- assertTrue:
    condition: "document.querySelectorAll('nav button').length >= 5"
    timeout: 30000

# Go to Clothing section where garments are
- tapOn:
    text: "Clothing"

# Wait for section to load
- assertTrue:
    condition: "Array.from(document.querySelectorAll('nav button')).some(b => b.textContent.trim() === 'Clothing' && b.classList.contains('bg-white'))"

# Tap on a product to open modal
- tapOn:
    point: 50%, 45%

# Verify modal opened
- extendedWaitUntil:
    visible: "Add to Cart"
    timeout: 15000

# Verify the 360° turn stage hint is visible
- assertVisible: "Drag to turn 360°"

# Perform a horizontal swipe on the turn stage to trigger drag
- swipe:
    start: 30%, 60%
    end: 70%, 60%
    duration: 500

# Verify the product image is still visible (snapped back to nearest quadrant)
- assertTrue:
    condition: "document.querySelector('.object-contain') !== null"

# Close modal
- tapOn:
    point: 90%, 10%