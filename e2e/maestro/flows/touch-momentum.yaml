# Maestro flow: Touch momentum and snap-back test
# Verifies that product 360° drag has momentum after release
# and spring snaps back to nearest quadrant
appId: com.showstudio.web
url: https://show-studio-seven.vercel.app
tags: [touch, momentum, snap]
---

- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

- waitfor:
    timeout: 5000

# Dismiss splash
- tapOn:
    point: 50%, 90%

# Go to Caps section - caps have simple front/side/back views
- tapOn:
    text: "Caps"

# Allow section to load
- waitfor:
    timeout: 3000

# Tap on a product to open modal
- tapOn:
    point: 50%, 50%

# Verify modal opened
- extendedWaitUntil:
    text: "Drag to turn 360°"
    timeout: 8000

# Perform a horizontal swipe on the turn stage to trigger drag
# This tests the touch interaction area
- swipe:
    start: 30%, 60%
    end: 70%, 60%
    duration: 500

# Wait for momentum to decay and snap-back
- waitfor:
    timeout: 4000

# Verify the product image is still visible (snapped back)
- assertVisible:
    element:
      className: "object-contain"

# Close modal
- tapOn:
    point: 90%, 10%
- assertNotVisible:
    text: "Drag to turn 360°"