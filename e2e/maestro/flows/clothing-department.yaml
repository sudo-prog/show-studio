# Maestro flow: Clothing department (Web)
# Original: horizontal chrome clothing rail, garments hang in single row
appId: com.showstudio.web
url: http://show-studio-seven.vercel.app
viewport:
  width: 390
  height: 844
tags: [clothing, department]
---

- launchApp:
    url: http://show-studio-seven.vercel.app

- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

# Wait for nav pills and bring into view
- scrollUntilVisible:
    element:
      text: "Store"
    direction: DOWN
    timeout: 30000

# Navigate to Clothing department
- tapOn:
    text: "Clothing"

# Verify section changed - Clothing button should be active (bg-stone-900 = dark on light nav)
- assertTrue:
    condition: "Array.from(document.querySelectorAll('nav button')).some(b => b.textContent.trim() === 'Clothing' && b.classList.contains('bg-stone-900'))"

# Verify 3D canvas is present
- assertTrue:
    condition: "document.querySelector('canvas') !== null"