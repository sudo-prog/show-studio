# Maestro flow: Clothing department (Web)
# Original: horizontal chrome clothing rail, garments hang in single row
appId: com.showstudio.web
url: http://show-studio-seven.vercel.app
viewport:
  width: 390
  height: 844
tags: [clothing, department]
---

- launchApp:
    url: http://show-studio-seven.vercel.app

- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

# Dismiss splash
- tapOn:
    point: 50%, 90%

# Navigate to Clothing department
- tapOn:
    text: "Clothing"

# Verify we're in clothing section - check active button state via JS
- assertTrue:
    condition: "document.querySelector('nav') !== null"

# Verify 3D canvas is present in clothing view
- assertTrue:
    condition: "document.querySelector('canvas') !== null"

# Verify return to overview works
- tapOn:
    text: "Store"
- assertVisible: "Store"