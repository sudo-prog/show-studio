# Maestro flow: Home / Overview page verification (Web)
# Verifies the bottom navigation matches the original Nike Virtual Store
# Original nav order: Store / Clothing / Caps / Bags / Shoes
appId: com.showstudio.web
url: http://show-studio-seven.vercel.app
viewport:
  width: 390
  height: 844
tags: [smoke, overview]
---

# Launch the web app
- launchApp:
    url: http://show-studio-seven.vercel.app

# Wait for brand wordmark to appear
- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

# Verify "VIRTUAL STORE" subtitle
- assertVisible: "VIRTUAL STORE"

# Verify bottom pill bar navigation - order matches original Nike store
# Original: Store / Clothing / Caps / Bags / Shoes
- scrollUntilVisible:
    element:
      text: "Store"
    direction: DOWN
    timeout: 10000

- assertVisible: "Store"
- assertVisible: "Clothing"
- assertVisible: "Caps"
- assertVisible: "Bags"
- assertVisible: "Shoes"

# Verify the info (i) button is at the far right
# Use JS assertion since icon-only element has no text
- assertTrue:
    condition: "document.querySelector('[aria-label=\"How to explore virtual store\"]') !== null"

# Verify header buttons present (360° Overview / Brand Studio)
- assertTrue:
    condition: "document.querySelector('button') !== null"

# Verify 3D canvas container with touch-none class
- assertTrue:
    condition: "document.querySelector('.touch-none') !== null"

# Verify shopping cart button has id
- assertTrue:
    condition: "document.getElementById('cart-button') !== null"