# Maestro flow: Shoes department (Web)
# Original: 3x3 floating shelf grid with soft contact shadows
appId: com.showstudio.web
url: http://show-studio-seven.vercel.app
viewport:
  width: 390
  height: 844
tags: [shoes, department]
---

- launchApp:
    url: http://show-studio-seven.vercel.app

- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

# Dismiss splash
- tapOn:
    point: 50%, 90%

# Navigate to Shoes department
- tapOn:
    text: "Shoes"

# Verify we're in shoes section
- assertTrue:
    condition: "document.querySelector('canvas') !== null"

# Verify return to overview
- tapOn:
    text: "Store"
- assertVisible: "Store"