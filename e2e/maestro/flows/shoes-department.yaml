# Maestro flow: Shoes department (Web)
# Original: 3x3 floating shelf grid with soft contact shadows
appId: com.showstudio.web
url: http://show-studio-seven.vercel.app
viewport:
  width: 390
  height: 844
tags: [shoes, department]
---

- launchApp:
    url: http://show-studio-seven.vercel.app

- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

# Wait for nav pills to be rendered via JS
- assertTrue:
    condition: "document.querySelectorAll('nav button').length >= 5"
    timeout: 30000

# Navigate to Shoes department
- tapOn:
    text: "Shoes"

# Verify section changed - Shoes button should be active (bg-white)
- assertTrue:
    condition: "Array.from(document.querySelectorAll('nav button')).some(b => b.textContent.trim() === 'Shoes' && b.classList.contains('bg-white'))"

# Verify 3D canvas is present
- assertTrue:
    condition: "document.querySelector('canvas') !== null"