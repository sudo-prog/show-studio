# Maestro flow: Overview page - verify camera angle and environment (Web)
# Original: eye-level camera, slightly off-center into a corner
appId: com.showstudio.web
url: http://show-studio-seven.vercel.app
viewport:
  width: 390
  height: 844
tags: [overview, camera]
---

- launchApp:
    url: http://show-studio-seven.vercel.app

- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

# Dismiss splash
- tapOn:
    point: 50%, 90%

# Verify the 3D canvas container exists with touch-none class
- assertTrue:
    condition: "document.querySelector('.touch-none') !== null"

# Verify all four department wall lettering is present (fades when product open)
# These are rendered as Three.js Text in the scene - check via JS
- assertTrue:
    condition: "document.querySelector('canvas') !== null"

# Verify the floor mesh exists (3D scene)
- assertTrue:
    condition: "document.querySelectorAll('canvas').length >= 1"

# Verify wall section signs via 3D scene presence
# COLLECTION / APPAREL, FOOTWEAR STUDIO, BAGS & UTILITY, HEADWEAR ARCHIVE
- assertTrue:
    condition: "document.querySelector('.select-none') !== null"