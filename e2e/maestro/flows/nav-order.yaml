# Maestro flow: Bottom Nav Order Verification (Web)
# Matches original Nike Virtual Store navigation order exactly:
# Store / Clothing / Caps / Bags / Shoes / i
appId: com.showstudio.web
url: http://show-studio-seven.vercel.app
viewport:
  width: 390
  height: 844
tags: [smoke, nav]
---

- launchApp:
    url: http://show-studio-seven.vercel.app

- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

# Dismiss splash by tapping center
- tapOn:
    point: 50%, 90%

# Scroll bottom bar into view
- scrollUntilVisible:
    element:
      text: "Store"
    direction: DOWN
    timeout: 10000

# Verify exact nav order: Store, Clothing, Caps, Bags, Shoes
- assertVisible: "Store"
- assertVisible: "Clothing"
- assertVisible: "Caps"
- assertVisible: "Bags"
- assertVisible: "Shoes"

# Verify info button exists (icon-only, use JS)
- assertTrue:
    condition: "document.querySelector('[aria-label=\"How to explore virtual store\"]') !== null"