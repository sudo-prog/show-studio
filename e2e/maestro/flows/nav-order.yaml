# Maestro flow: Bottom Nav Order Verification (Web)
# Matches original Nike Virtual Store navigation order exactly:
# Store / Clothing / Caps / Bags / Shoes / i
appId: com.showstudio.web
url: http://show-studio-seven.vercel.app
viewport:
  width: 390
  height: 844
tags: [smoke, nav]
---

- launchApp:
    url: http://show-studio-seven.vercel.app

# Wait for brand wordmark
- extendedWaitUntil:
    visible: "NIKE"
    timeout: 15000

# Wait for nav pills to be rendered via JS check
- assertTrue:
    condition: "document.querySelectorAll('nav button').length >= 5"
    timeout: 30000

# Verify exact nav order: Store, Clothing, Caps, Bags, Shoes
- assertVisible: "Store"
- assertVisible: "Clothing"
- assertVisible: "Caps"
- assertVisible: "Bags"
- assertVisible: "Shoes"

# Verify info button exists (icon-only)
- assertTrue:
    condition: "document.querySelector('[aria-label=\"How to explore virtual store\"]') !== null"